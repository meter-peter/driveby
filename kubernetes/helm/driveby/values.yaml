# DriveBy Helm Chart Values

namespace: driveby

# Container image
image:
  repository: ghcr.io/meter-peter/driveby
  tag: latest
  pullPolicy: IfNotPresent

# API auth — shared between app containers + workflow steps
apiAuth:
  secretName: driveby-api-auth
  apiKey: "driveby-test-key-2024"
  apiKeyHeader: "X-API-Key"

# ArgoCD configuration (existing installation)
argocd:
  enabled: true
  # Do NOT install ArgoCD — it already exists on the cluster
  # Only create AppProject
  project: driveby
  server: https://argocd.private.novelcore.org

# Argo Workflows
argoWorkflows:
  enabled: true
  namespace: driveby

# Argo Events
argoEvents:
  enabled: true
  webhook:
    port: 12000

# Crossplane — installs provider-kubernetes + functions via Package CRs
# Crossplane itself must be pre-installed (crossplane-system namespace)
crossplane:
  enabled: true
  providers:
    kubernetes:
      package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes
      version: "v0.14.1"
  functions:
    goTemplating:
      package: xpkg.upbound.io/crossplane-contrib/function-go-templating
      version: "v0.10.0"
    autoReady:
      package: xpkg.upbound.io/crossplane-contrib/function-auto-ready
      version: "v0.4.0"
  providerConfig:
    name: kubernetes-provider
    credentials: InjectedIdentity

# Cluster-wide defaults baked into Crossplane compositions at helm-template time.
# Override per-CR via XRD spec fields. No EnvironmentConfig layer — 2-tier only.
defaults:
  # URL shown in GitHub commit status (link to Argo Workflows UI)
  argoWorkflowsUrl: "https://argo.private.novelcore.org/workflows"

  # Ingress configuration for webhook endpoints
  ingress:
    className: "traefik-system"
    clusterIssuer: "sys-prod-issuer-dns"
    baseDomain: "private.novelcore.org"
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"

  # GitHub API base URL (change for GitHub Enterprise Server)
  github:
    apiUrl: "https://api.github.com"

  # Secret names used by workflow steps
  secrets:
    imagePullSecret: "ghcr-creds"
    apiAuth:
      name: "driveby-api-auth"
      keyField: "api-key"
    apiKeyHeader: "X-API-Key"

  # Webhook port for Argo Events EventSource
  webhookPort: 12000

  # Utility container images (pin versions, not :latest)
  images:
    curl: "curlimages/curl:8.7.1"
    postgres: "postgres:16-alpine"

  # JetStream EventBus configuration
  eventBus:
    jetstream:
      version: "2.10.10"
      replicas: 1

# GitOps Promoter — auto-promotion pipeline via gitops-promoter controller
gitopsPromoter:
  enabled: true
  githubApp:
    secretName: "github-app-credentials"
    appID: 3133001
    installationID: 117564832
    privateKey: ""  # Set at install: --set-file gitopsPromoter.githubApp.privateKey=/path/to/key.pem
  branchPattern: "environment"

# XSDLC v2.0.0 — single-repo delivery pipeline
# No gitopsPat needed: developer's repo is the only repo.
# XSDLC owns delivery (propagation, promotion, quality gates), not CI.

# GitHub Provider — for managing branch protection rules via Crossplane
githubProvider:
  enabled: true
  provider:
    package: xpkg.upbound.io/crossplane-contrib/provider-upjet-github
    version: "v0.18.0"
  providerConfigName: "github-provider"
  secretName: "github-provider-token"     # Secret with JSON credentials: {"token":"...","owner":"..."}
  secretKey: "credentials"
  token: ""   # If set, creates the github-provider-token secret automatically
  owner: ""   # GitHub org/user for branch protection

# Optional secrets — reduce manual kubectl create secret steps
secrets:
  ghcr:
    enabled: false      # Set to true to create ghcr-creds secret in driveby namespace
    registry: ghcr.io
    username: ""        # GitHub username or org
    token: ""           # GitHub PAT or GITHUB_TOKEN with packages:read

# RBAC
rbac:
  create: true

# Reports PVC
reports:
  storageSize: 1Gi
  storageClass: ""
