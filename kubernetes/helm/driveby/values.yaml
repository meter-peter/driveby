# DriveBy Helm Chart Values

namespace: driveby

# Domain for ingress
domain: private.novelcore.org

# Container image
image:
  repository: ghcr.io/meter-peter/driveby
  tag: latest
  pullPolicy: IfNotPresent

# API auth — shared between app containers + workflow steps
apiAuth:
  secretName: driveby-api-auth
  apiKey: "driveby-test-key-2024"
  apiKeyHeader: "X-API-Key"

# ArgoCD configuration (existing installation)
argocd:
  enabled: true
  # Do NOT install ArgoCD — it already exists on the cluster
  # Only create AppProject
  project: driveby
  server: https://argocd.private.novelcore.org

# Argo Workflows
argoWorkflows:
  enabled: true
  namespace: driveby

# Argo Events
argoEvents:
  enabled: true
  webhook:
    port: 12000

# Crossplane — installs provider-kubernetes + functions via Package CRs
# Crossplane itself must be pre-installed (crossplane-system namespace)
crossplane:
  enabled: true
  providers:
    kubernetes:
      package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes
      version: "v0.14.1"
  functions:
    goTemplating:
      package: xpkg.upbound.io/crossplane-contrib/function-go-templating
      version: "v0.10.0"
    autoReady:
      package: xpkg.upbound.io/crossplane-contrib/function-auto-ready
      version: "v0.4.0"
    sequencer:
      package: xpkg.upbound.io/crossplane-contrib/function-sequencer
      version: "v0.2.0"
    environmentConfigs:
      package: xpkg.upbound.io/crossplane-contrib/function-environment-configs
      version: "v0.3.0"
  providerConfig:
    name: kubernetes-provider
    credentials: InjectedIdentity

# Cluster-wide defaults baked into Crossplane compositions at helm-template time.
# Override per-cluster via EnvironmentConfigs, or per-CR via XRD spec fields.
defaults:
  # URL shown in GitHub commit status (link to Argo Workflows UI)
  argoWorkflowsUrl: "https://argo.private.novelcore.org/workflows"

  # Ingress configuration for webhook endpoints
  ingress:
    className: "traefik-system"
    clusterIssuer: "sys-prod-issuer-dns"
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"

  # GitHub API base URL (change for GitHub Enterprise Server)
  github:
    apiUrl: "https://api.github.com"

  # Secret names used by workflow steps
  secrets:
    imagePullSecret: "ghcr-creds"
    apiAuth:
      name: "driveby-api-auth"
      keyField: "api-key"
    apiKeyHeader: "X-API-Key"

  # Webhook port for Argo Events EventSource
  webhookPort: 12000

  # Utility container images (pin versions, not :latest)
  images:
    curl: "curlimages/curl:8.7.1"
    postgres: "postgres:16-alpine"

  # JetStream EventBus configuration
  eventBus:
    jetstream:
      version: "2.10.10"
      replicas: 1

# GitOps Promoter — auto-promotion pipeline via gitops-promoter controller
gitopsPromoter:
  enabled: true
  githubApp:
    secretName: "github-app-credentials"
    appID: 0
    installationID: 0
    privateKey: ""  # Set at install: --set-file gitopsPromoter.githubApp.privateKey=/path/to/key.pem
  branchPattern: "environment"

# GitHub integration
github:
  owner: "meter-peter"
  repo: "driveby"

# RBAC
rbac:
  create: true

# Reports PVC
reports:
  storageSize: 1Gi
  storageClass: ""
