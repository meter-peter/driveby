# DriveBy Helm Chart Values

namespace: driveby

# Domain for ingress
domain: private.novelcore.org

# Container image
image:
  repository: ghcr.io/meter-peter/driveby
  tag: latest
  pullPolicy: IfNotPresent

# Application definitions (iterable for future APIs)
apps:
  - name: perfect-api
    repo: https://github.com/meter-peter/driveby
    path: apis/perfect-api
    port: 8000
    image:
      repository: ghcr.io/meter-peter/driveby-perfect-api
      tag: latest
    healthCheck:
      path: /test/health
    openapi:
      endpoint: /openapi.json

# Environment definitions
environments:
  - name: dev
    namespace: driveby-dev
    autoSync: true
  - name: staging
    namespace: driveby-staging
    autoSync: false
  - name: prod
    namespace: driveby-prod
    autoSync: false

# API auth — shared between app containers + workflow steps
apiAuth:
  secretName: driveby-api-auth
  apiKey: "driveby-test-key-2024"
  apiKeyHeader: "X-API-Key"

# ArgoCD configuration (existing installation)
argocd:
  enabled: true
  # Do NOT install ArgoCD — it already exists on the cluster
  # Only create AppProject and Applications
  project: driveby
  server: https://argocd.private.novelcore.org

# Argo Workflows
argoWorkflows:
  enabled: true
  namespace: driveby

# Argo Events
argoEvents:
  enabled: true
  webhook:
    port: 12000

# Crossplane
crossplane:
  enabled: false
  providers:
    kubernetes:
      version: "v0.14.0"
    github:
      version: "v0.2.0"

# GitOps Promoter
gitopsPromoter:
  enabled: false

# GitHub integration
github:
  owner: "meter-peter"
  repo: "driveby"
  secretName: driveby-github-credentials
  pat: ""  # Set at install: --set github.pat=ghp_xxx

# RBAC
rbac:
  create: true

# Reports PVC
reports:
  storageSize: 1Gi
  storageClass: ""
