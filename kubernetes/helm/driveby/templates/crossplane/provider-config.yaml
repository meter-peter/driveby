{{- if .Values.crossplane.enabled }}
{{/*
  ProviderConfig for provider-kubernetes.
  On first install, provider CRDs may not exist yet.
  The post-install Job (provider-config-job.yaml) handles this with kubectl wait + apply.
  On subsequent upgrades, Helm applies this directly since CRDs are already registered.
*/}}
{{- if .Capabilities.APIVersions.Has "kubernetes.crossplane.io/v1alpha1" }}
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: {{ .Values.crossplane.providerConfig.name }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
spec:
  credentials:
    source: {{ .Values.crossplane.providerConfig.credentials }}
{{- end }}
{{- end }}
