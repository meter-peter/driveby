{{- if .Values.crossplane.enabled }}
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xqualitygates.driveby.io
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
spec:
  scope: Namespaced
  group: driveby.io
  names:
    kind: XQualityGate
    plural: xqualitygates
  defaultCompositionRef:
    name: xqualitygates.driveby.io
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        description: "Quality Gate instance — per-app webhook and event handling"
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - appName
            - projectName
            - gateName
            - templateRef
            - targetCluster
            - repositoryConfig
            - eventTriggers
            properties:
              appName:
                type: string
                description: "App name (e.g., perfect-api)"
              projectName:
                type: string
                description: "Project name"
              gateName:
                type: string
                description: "Must match a template's gateName"
              templateRef:
                type: object
                description: "Reference to XQualityGateTemplate"
                required:
                - name
                properties:
                  name:
                    type: string
                    description: "XQualityGateTemplate name"
              targetCluster:
                type: object
                description: "Target Kubernetes cluster configuration"
                required:
                - name
                - providerConfigName
                - baseDomain
                properties:
                  name:
                    type: string
                    description: "Cluster name"
                  providerConfigName:
                    type: string
                    description: "ProviderConfig ref"
                  baseDomain:
                    type: string
                    description: "Base domain for webhook ingress"
                  namespace:
                    type: string
                    description: "Namespace for resources (defaults to appName)"
              repositoryConfig:
                type: object
                description: "GitHub repository configuration"
                required:
                - owner
                - name
                - fullName
                properties:
                  owner:
                    type: string
                    description: "GitHub repo owner"
                  name:
                    type: string
                    description: "GitHub repo name"
                  fullName:
                    type: string
                    description: "Full name (owner/name)"
              apiConfig:
                type: object
                description: "API configuration for DriveBy validation"
                properties:
                  openapiEndpoint:
                    type: string
                    description: "OpenAPI spec path"
                    default: "/openapi.json"
                  port:
                    type: integer
                    description: "API port"
                    default: 8000
                  serviceName:
                    type: string
                    description: "Kubernetes service name (defaults to appName)"
                  sourceEnvironment:
                    type: object
                    description: "Source environment to validate against (already deployed)"
                    properties:
                      namespace:
                        type: string
                        description: "Namespace where the source environment runs"
                  targetEnvironment:
                    type: object
                    description: "Target environment for promotion"
                    properties:
                      namespace:
                        type: string
                        description: "Namespace for the target environment"
                  authSecretName:
                    type: string
                    description: "Auth secret ref"
                    default: "driveby-api-auth"
                  authKeyHeader:
                    type: string
                    description: "Auth header name"
                    default: "X-API-Key"
              githubConfig:
                type: object
                description: "GitHub PAT authentication configuration"
                properties:
                  patSecretName:
                    type: string
                    description: "PAT secret name"
                    default: "github-pat"
                  patSecretKey:
                    type: string
                    description: "PAT secret key"
                    default: "token"
              ingressConfig:
                type: object
                description: "Ingress configuration for webhook endpoint"
                properties:
                  className:
                    type: string
                    description: "Ingress class name (e.g., nginx, traefik-system)"
                  clusterIssuer:
                    type: string
                    description: "cert-manager ClusterIssuer name"
                  annotations:
                    type: object
                    description: "Additional ingress annotations"
                    x-kubernetes-preserve-unknown-fields: true
                  tls:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
              eventBusConfig:
                type: object
                description: "JetStream EventBus configuration"
                properties:
                  jetstreamVersion:
                    type: string
                  replicas:
                    type: integer
                    minimum: 1
              webhookPort:
                type: integer
                description: "Port for webhook EventSource endpoint"
              eventTriggers:
                type: array
                description: "Event trigger configurations"
                items:
                  type: object
                  required:
                  - name
                  - targetTemplate
                  - events
                  properties:
                    name:
                      type: string
                      description: "Trigger identifier"
                    targetTemplate:
                      type: string
                      description: "WorkflowTemplate entrypoint to execute"
                    events:
                      type: array
                      description: "GitHub events to listen for"
                      minItems: 1
                      items:
                        type: string
                        enum:
                        - deployment
                        - deployment_status
                        - pull_request
                        - push
                        - create
                        - delete
                        - issue_comment
                        - status
                        - check_run
                        - check_suite
                    filters:
                      type: array
                      description: "Event payload filters (Argo Events data filter format)"
                      items:
                        type: object
                        required:
                        - path
                        - type
                        - value
                        properties:
                          path:
                            type: string
                            description: "JSONPath to filter field"
                          type:
                            type: string
                            enum: [string, number, bool]
                          value:
                            type: array
                            items:
                              type: string
                    parameterMapping:
                      type: array
                      description: "Map event payload to workflow parameters"
                      items:
                        type: object
                        required:
                        - from
                        - to
                        properties:
                          from:
                            type: string
                            description: "Event payload path"
                          to:
                            type: string
                            description: "Workflow parameter name"
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              webhookUrl:
                type: string
                description: "Webhook URL for event ingress"
              eventSourceReady:
                type: boolean
              sensorReady:
                type: boolean
              ingressReady:
                type: boolean
              triggers:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    targetTemplate:
                      type: string
                    events:
                      type: array
                      items:
                        type: string
                    ready:
                      type: boolean
              resources:
                type: object
                properties:
                  eventSource:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  sensor:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  ingress:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
              ready:
                type: boolean
    additionalPrinterColumns:
    - name: App
      type: string
      jsonPath: .spec.appName
    - name: Project
      type: string
      jsonPath: .spec.projectName
    - name: Gate
      type: string
      jsonPath: .spec.gateName
    - name: Webhook
      type: string
      jsonPath: .status.webhookUrl
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=='Ready')].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}
