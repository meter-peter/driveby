{{- if and .Values.crossplane.enabled .Values.githubProvider.enabled }}
{{/*
  ProviderConfig for provider-upjet-github.
  On first install, provider CRDs may not exist yet.
  The post-install Job (provider-config-job.yaml) handles this with kubectl wait + apply.
  On subsequent upgrades, Helm applies this directly since CRDs are already registered.
*/}}
{{- if .Capabilities.APIVersions.Has "github.upbound.io/v1beta1" }}
apiVersion: github.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ .Values.githubProvider.providerConfigName }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: {{ .Values.namespace | default "driveby" }}
      name: {{ .Values.githubProvider.secretName }}
      key: {{ .Values.githubProvider.secretKey }}
{{- end }}
{{- end }}
