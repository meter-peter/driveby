{{- if .Values.crossplane.enabled }}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqualitygates.driveby.io
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
    driveby.io/type: qualitygate-instance
spec:
  compositeTypeRef:
    apiVersion: driveby.io/v1alpha1
    kind: XQualityGate
  mode: Pipeline
  pipeline:

  # Step 1: Load EnvironmentConfig for instance configuration
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: driveby.io/type
              type: Value
              value: qualitygate-instance-config
            - key: driveby.io/app
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.appName
            - key: driveby.io/gate
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.gateName

  # Step 2: Generate EventBus, EventSource, Sensor, Ingress
  - step: generate-instance-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{`{{- $xr := .observed.composite.resource -}}`}}
          {{`{{- $spec := $xr.spec -}}`}}
          {{`{{- $env := .environment -}}`}}
          {{`{{- $name := $xr.metadata.name -}}`}}

          {{`{{/* Extract configuration */}}`}}
          {{`{{- $appName := $spec.appName -}}`}}
          {{`{{- $projectName := $spec.projectName -}}`}}
          {{`{{- $gateName := $spec.gateName -}}`}}
          {{`{{- $targetCluster := $spec.targetCluster -}}`}}
          {{`{{- $providerConfigName := $targetCluster.providerConfigName -}}`}}
          {{`{{- $baseDomain := $targetCluster.baseDomain -}}`}}
          {{`{{- $appNamespace := $targetCluster.namespace | default $appName -}}`}}
          {{`{{- $repoConfig := $spec.repositoryConfig -}}`}}

          {{`{{/* GitHub PAT config */}}`}}
          {{`{{- $githubConfig := $spec.githubConfig | default dict -}}`}}
          {{`{{- $patSecretName := $githubConfig.patSecretName | default "github-pat" -}}`}}
          {{`{{- $patSecretKey := $githubConfig.patSecretKey | default "token" -}}`}}

          {{`{{/* API config and promotion model */}}`}}
          {{`{{- $apiConfig := $spec.apiConfig | default dict -}}`}}
          {{`{{- $serviceName := $apiConfig.serviceName | default $appName -}}`}}
          {{`{{- $sourceEnv := $apiConfig.sourceEnvironment | default dict -}}`}}
          {{`{{- $targetEnv := $apiConfig.targetEnvironment | default dict -}}`}}
          {{`{{- $sourceNamespace := $sourceEnv.namespace | default (printf "%s-dev" $appName) -}}`}}
          {{`{{- $targetNamespace := $targetEnv.namespace | default (printf "%s-staging" $appName) -}}`}}
          {{`{{- $openapiEndpoint := $apiConfig.openapiEndpoint | default "/openapi.json" -}}`}}

          {{`{{/* Three-tier configurable values: XR spec → EnvironmentConfig → Helm-baked default */}}`}}
          {{`{{- $ingressConfig := $spec.ingressConfig | default dict -}}`}}
          {{`{{- $eventBusConfig := $spec.eventBusConfig | default dict -}}`}}

          {{`{{- $webhookPort := $spec.webhookPort | default ($env.webhookPort | default `}}{{ .Values.defaults.webhookPort }}{{`) -}}`}}
          {{`{{- $ingressClassName := $ingressConfig.className | default ($env.ingressClassName | default `}}"{{ .Values.defaults.ingress.className }}"{{`) -}}`}}
          {{`{{- $clusterIssuer := $ingressConfig.clusterIssuer | default ($env.clusterIssuer | default `}}"{{ .Values.defaults.ingress.clusterIssuer }}"{{`) -}}`}}
          {{`{{- $jetstreamVersion := $eventBusConfig.jetstreamVersion | default ($env.jetstreamVersion | default `}}"{{ .Values.defaults.eventBus.jetstream.version }}"{{`) -}}`}}
          {{`{{- $eventBusReplicas := $eventBusConfig.replicas | default ($env.eventBusReplicas | default `}}{{ .Values.defaults.eventBus.jetstream.replicas }}{{`) -}}`}}
          {{`{{- $appPort := $apiConfig.port | default 8000 -}}`}}

          {{`{{/* Event triggers */}}`}}
          {{`{{- $triggers := $spec.eventTriggers | default list -}}`}}
          {{`{{- $hasTriggers := gt (len $triggers) 0 -}}`}}

          {{`{{/* Resource names */}}`}}
          {{`{{- $eventSourceName := printf "%s-%s-eventsource" $appName $gateName -}}`}}
          {{`{{- $sensorName := printf "%s-%s-sensor" $appName $gateName -}}`}}
          {{`{{- $ingressName := printf "%s-%s-webhook-ingress" $appName $gateName -}}`}}
          {{`{{- $webhookHost := printf "%s-%s-webhook.%s" $appName $gateName $baseDomain -}}`}}
          {{`{{- $workflowTemplateName := printf "%s-%s" $projectName $gateName -}}`}}
          {{`{{- $resourcePrefix := printf "%s-%s-%s" $projectName $appName $gateName -}}`}}

          ---
          # EventBus — JetStream for event transport
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{`{{ $name }}`}}-eventbus
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eventbus
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{`{{ $providerConfigName }}`}}
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: EventBus
                metadata:
                  name: default
                  namespace: {{`{{ $appNamespace }}`}}
                  labels:
                    driveby.io/app: {{`{{ $appName | quote }}`}}
                    driveby.io/project: {{`{{ $projectName | quote }}`}}
                    driveby.io/gate: {{`{{ $gateName | quote }}`}}
                spec:
                  jetstream:
                    version: {{`{{ $jetstreamVersion | quote }}`}}
                    replicas: {{`{{ $eventBusReplicas }}`}}
                    streamConfig: |
                      replicas: {{`{{ $eventBusReplicas }}`}}

          {{`{{- if $hasTriggers }}`}}
          ---
          # EventSource — GitHub webhook with PAT auth
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{`{{ $name }}`}}-eventsource
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eventsource
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{`{{ $providerConfigName }}`}}
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: EventSource
                metadata:
                  name: {{`{{ $eventSourceName }}`}}
                  namespace: {{`{{ $appNamespace }}`}}
                  labels:
                    driveby.io/app: {{`{{ $appName | quote }}`}}
                    driveby.io/project: {{`{{ $projectName | quote }}`}}
                    driveby.io/gate: {{`{{ $gateName | quote }}`}}
                spec:
                  github:
                    {{`{{- range $trigger := $triggers }}`}}
                    {{`{{ $trigger.name }}`}}:
                      repositories:
                      - owner: {{`{{ $repoConfig.owner }}`}}
                        names:
                        - {{`{{ $repoConfig.name }}`}}
                      webhook:
                        endpoint: /{{`{{ $appName }}`}}-{{`{{ $gateName }}`}}-{{`{{ $trigger.name }}`}}
                        port: {{`{{ $webhookPort | quote }}`}}
                        method: POST
                      events:
                      {{`{{- range $event := $trigger.events }}`}}
                        - {{`{{ $event | quote }}`}}
                      {{`{{- end }}`}}
                      apiToken:
                        name: {{`{{ $patSecretName }}`}}
                        key: {{`{{ $patSecretKey }}`}}
                      insecure: false
                      active: true
                      contentType: json
                    {{`{{- end }}`}}

          ---
          # Sensor — PR event filters, triggers workflow
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{`{{ $name }}`}}-sensor
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: sensor
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{`{{ $providerConfigName }}`}}
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: Sensor
                metadata:
                  name: {{`{{ $sensorName }}`}}
                  namespace: {{`{{ $appNamespace }}`}}
                  labels:
                    driveby.io/app: {{`{{ $appName | quote }}`}}
                    driveby.io/project: {{`{{ $projectName | quote }}`}}
                    driveby.io/gate: {{`{{ $gateName | quote }}`}}
                spec:
                  dependencies:
                  {{`{{- range $trigger := $triggers }}`}}
                  - name: {{`{{ $trigger.name }}`}}-dep
                    eventSourceName: {{`{{ $eventSourceName }}`}}
                    eventName: {{`{{ $trigger.name }}`}}
                    {{`{{- if $trigger.filters }}`}}
                    filters:
                      data:
                      {{`{{- range $filter := $trigger.filters }}`}}
                      - path: {{`{{ $filter.path | quote }}`}}
                        type: {{`{{ $filter.type | default "string" | quote }}`}}
                        value:
                        {{`{{- range $value := $filter.value }}`}}
                          - {{`{{ $value | quote }}`}}
                        {{`{{- end }}`}}
                      {{`{{- end }}`}}
                    {{`{{- end }}`}}
                  {{`{{- end }}`}}

                  triggers:
                  {{`{{- range $idx, $trigger := $triggers }}`}}
                  - template:
                      name: {{`{{ $trigger.name }}`}}-workflow-trigger
                      argoWorkflow:
                        operation: submit
                        source:
                          resource:
                            apiVersion: argoproj.io/v1alpha1
                            kind: Workflow
                            metadata:
                              generateName: {{`{{ $resourcePrefix }}`}}-{{`{{ $trigger.targetTemplate }}`}}-
                              namespace: {{`{{ $appNamespace }}`}}
                              labels:
                                driveby.io/app: {{`{{ $appName | quote }}`}}
                                driveby.io/project: {{`{{ $projectName | quote }}`}}
                                driveby.io/gate: {{`{{ $gateName | quote }}`}}
                                driveby.io/trigger: {{`{{ $trigger.name | quote }}`}}
                            spec:
                              workflowTemplateRef:
                                name: {{`{{ $workflowTemplateName }}`}}
                              arguments:
                                parameters:
                                {{`{{- if $trigger.parameterMapping }}`}}
                                {{`{{- range $param := $trigger.parameterMapping }}`}}
                                - name: {{`{{ $param.to }}`}}
                                {{`{{- end }}`}}
                                {{`{{- end }}`}}
                                - name: app-name
                                  value: "{{`{{ $appName }}`}}"
                                - name: app-port
                                  value: "{{`{{ $appPort }}`}}"
                                - name: source-namespace
                                  value: "{{`{{ $sourceNamespace }}`}}"
                                - name: target-namespace
                                  value: "{{`{{ $targetNamespace }}`}}"
                                - name: service-name
                                  value: "{{`{{ $serviceName }}`}}"
                                - name: openapi-endpoint
                                  value: "{{`{{ $openapiEndpoint }}`}}"
                        {{`{{- if $trigger.parameterMapping }}`}}
                        parameters:
                        {{`{{- range $paramIdx, $param := $trigger.parameterMapping }}`}}
                        - src:
                            dependencyName: {{`{{ $trigger.name }}`}}-dep
                            dataKey: {{`{{ $param.from }}`}}
                          dest: spec.arguments.parameters.{{`{{ $paramIdx }}`}}.value
                        {{`{{- end }}`}}
                        {{`{{- end }}`}}
                  {{`{{- end }}`}}

          ---
          # Service for EventSource webhook endpoint
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{`{{ $name }}`}}-eventsource-svc
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eventsource-svc
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{`{{ $providerConfigName }}`}}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: {{`{{ $eventSourceName }}`}}-svc
                  namespace: {{`{{ $appNamespace }}`}}
                  labels:
                    driveby.io/app: {{`{{ $appName | quote }}`}}
                    driveby.io/project: {{`{{ $projectName | quote }}`}}
                    driveby.io/gate: {{`{{ $gateName | quote }}`}}
                spec:
                  selector:
                    controller: eventsource-controller
                    eventsource-name: {{`{{ $eventSourceName }}`}}
                  ports:
                    - port: {{`{{ $webhookPort }}`}}
                      targetPort: {{`{{ $webhookPort }}`}}
                      protocol: TCP

          ---
          # Ingress — configurable ingress controller with optional cert-manager TLS
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{`{{ $name }}`}}-ingress
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ingress
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{`{{ $providerConfigName }}`}}
            forProvider:
              manifest:
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: {{`{{ $ingressName }}`}}
                  namespace: {{`{{ $appNamespace }}`}}
                  labels:
                    driveby.io/app: {{`{{ $appName | quote }}`}}
                    driveby.io/project: {{`{{ $projectName | quote }}`}}
                    driveby.io/gate: {{`{{ $gateName | quote }}`}}
                  annotations:
                    {{`{{- if $clusterIssuer }}`}}
                    cert-manager.io/cluster-issuer: {{`{{ $clusterIssuer | quote }}`}}
                    {{`{{- end }}`}}
                    {{- range $k, $v := .Values.defaults.ingress.annotations }}
                    {{ $k }}: {{ $v | quote }}
                    {{- end }}
                    {{`{{- range $k, $v := ($ingressConfig.annotations | default dict) }}`}}
                    {{`{{ $k }}`}}: {{`{{ $v | quote }}`}}
                    {{`{{- end }}`}}
                spec:
                  ingressClassName: {{`{{ $ingressClassName }}`}}
                  tls:
                  - hosts:
                    - {{`{{ $webhookHost | quote }}`}}
                    secretName: {{`{{ printf "%s-%s-webhook-tls" $appName $gateName | quote }}`}}
                  rules:
                  - host: {{`{{ $webhookHost | quote }}`}}
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{`{{ $eventSourceName }}`}}-svc
                            port:
                              number: {{`{{ $webhookPort }}`}}
          {{`{{- end }}`}}

  # Step 3: Auto-ready
  - step: detect-readiness
    functionRef:
      name: function-auto-ready
{{- end }}
