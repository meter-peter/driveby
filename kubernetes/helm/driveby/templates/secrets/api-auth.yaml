{{/* API auth Secret in the driveby namespace (for workflow access) */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiAuth.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.apiAuth.apiKey | quote }}
  api-key-header: {{ .Values.apiAuth.apiKeyHeader | quote }}
{{/* API auth Secret in each environment namespace */}}
{{- range .Values.environments }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.apiAuth.secretName }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: driveby
    app.kubernetes.io/component: {{ .name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  api-key: {{ $.Values.apiAuth.apiKey | quote }}
  api-key-header: {{ $.Values.apiAuth.apiKeyHeader | quote }}
{{- end }}
