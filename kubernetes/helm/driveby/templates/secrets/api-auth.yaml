{{/* API auth Secret in the driveby namespace (for workflow access) */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiAuth.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.apiAuth.apiKey | quote }}
  api-key-header: {{ .Values.apiAuth.apiKeyHeader | quote }}
