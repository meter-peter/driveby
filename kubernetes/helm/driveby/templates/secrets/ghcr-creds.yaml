{{/* Optional GHCR registry credentials — set secrets.ghcr.enabled=true to create */}}
{{- if .Values.secrets.ghcr.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.defaults.secrets.imagePullSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` .Values.secrets.ghcr.registry .Values.secrets.ghcr.username .Values.secrets.ghcr.token (printf "%s:%s" .Values.secrets.ghcr.username .Values.secrets.ghcr.token | b64enc) | b64enc }}
{{- end }}
