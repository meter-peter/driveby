{{/* Optional GitHub provider credentials — set githubProvider.token to create */}}
{{- if .Values.githubProvider.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubProvider.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.githubProvider.secretKey }}: |
    {
      "token": "{{ .Values.githubProvider.token }}",
      "owner": "{{ .Values.githubProvider.owner }}"
    }
{{- end }}
