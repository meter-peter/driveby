{{/* GitHub App credentials — used by all workflow steps and GitOps Promoter */}}
{{- if .Values.gitopsPromoter.githubApp.appID }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gitopsPromoter.githubApp.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "driveby.labels" . | nindent 4 }}
type: Opaque
stringData:
  githubAppID: {{ .Values.gitopsPromoter.githubApp.appID | quote }}
  githubInstallationID: {{ .Values.gitopsPromoter.githubApp.installationID | quote }}
  {{- if .Values.gitopsPromoter.githubApp.privateKey }}
  githubAppPrivateKey: {{ .Values.gitopsPromoter.githubApp.privateKey | quote }}
  {{- end }}
{{- end }}
