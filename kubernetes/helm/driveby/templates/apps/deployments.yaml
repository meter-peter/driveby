{{- range $app := .Values.apps }}
{{- range $env := $.Values.environments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  namespace: {{ $env.namespace }}
  labels:
    app.kubernetes.io/name: {{ $app.name }}
    app.kubernetes.io/component: {{ $env.name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $app.name }}
      app.kubernetes.io/component: {{ $env.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $app.name }}
        app.kubernetes.io/component: {{ $env.name }}
    spec:
      containers:
        - name: {{ $app.name }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $app.port }}
              protocol: TCP
          env:
            - name: EXPECTED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.apiAuth.secretName }}
                  key: api-key
          livenessProbe:
            httpGet:
              path: {{ $app.healthCheck.path }}
              port: {{ $app.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: {{ $app.healthCheck.path }}
              port: {{ $app.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.name }}
  namespace: {{ $env.namespace }}
  labels:
    app.kubernetes.io/name: {{ $app.name }}
    app.kubernetes.io/component: {{ $env.name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $app.port }}
      targetPort: {{ $app.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $app.name }}
    app.kubernetes.io/component: {{ $env.name }}
{{- end }}
{{- end }}
