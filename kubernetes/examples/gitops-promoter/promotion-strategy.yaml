# PromotionStrategy — generated automatically by XSDLC composition
# This example shows what the composition produces. Do NOT apply manually if using Crossplane.
apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: perfect-api-promotion
  namespace: driveby
  labels:
    driveby.io/app: perfect-api
    driveby.io/project: driveby
    driveby.io/gate: staging-promotion
spec:
  gitRepositoryRef:
    name: perfect-api
  activeCommitStatuses:
    - key: driveby-staging-promotion
  proposedCommitStatuses:
    - key: driveby-staging-promotion
  environments:
    - branch: environment/dev
      autoMerge: true
    - branch: environment/staging
      autoMerge: true
    - branch: environment/prod
      autoMerge: false
