apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: driveby-full-pipeline
  namespace: driveby
spec:
  entrypoint: full-pipeline
  arguments:
    parameters:
      - name: openapi-url
      - name: api-host
      - name: api-port
        value: "8080"
      - name: validation-mode
        value: "strict"
      - name: github-owner
        value: ""
      - name: github-repo
        value: ""
      - name: github-pr-number
        value: "0"
  templates:
    - name: full-pipeline
      dag:
        tasks:
          - name: validate
            template: driveby-step
            arguments:
              parameters:
                - name: command
                  value: "validate-only"
                - name: extra-args
                  value: "--validation-mode {{workflow.parameters.validation-mode}}"
          - name: functional-test
            template: driveby-step
            dependencies: [validate]
            arguments:
              parameters:
                - name: command
                  value: "function-only"
                - name: extra-args
                  value: ""
          - name: performance-test
            template: driveby-step
            dependencies: [validate]
            arguments:
              parameters:
                - name: command
                  value: "load-only"
                - name: extra-args
                  value: "--concurrent-users 10 --test-duration 60s"
    - name: driveby-step
      inputs:
        parameters:
          - name: command
          - name: extra-args
      container:
        image: ghcr.io/meter-peter/driveby:latest
        command: ["/driveby"]
        args:
          - "{{inputs.parameters.command}}"
          - "--openapi"
          - "{{workflow.parameters.openapi-url}}"
          - "--host"
          - "{{workflow.parameters.api-host}}"
          - "--port"
          - "{{workflow.parameters.api-port}}"
          - "--report-dir"
          - "/reports"
        volumeMounts:
          - name: reports
            mountPath: /reports
  volumeClaimTemplates:
    - metadata:
        name: reports
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
