apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: driveby-performance-testing
  namespace: argo
spec:
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: openapi-spec-url
        description: "URL to OpenAPI specification"
      - name: api-host
        description: "API host to test"
      - name: api-port
        description: "API port (default: 8080)"
        value: "8080"
      - name: api-protocol
        description: "API protocol (http/https)"
        value: "http"
      - name: environment
        description: "Environment name"
        value: "production"
      - name: timeout
        description: "Request timeout in seconds"
        value: "30"
      - name: concurrent-users
        description: "Number of concurrent users for load testing"
        value: "10"
      - name: test-duration
        description: "Duration of load test in seconds"
        value: "300"
      - name: max-latency-p95
        description: "Maximum allowed P95 latency in milliseconds"
        value: "500"
      - name: min-success-rate
        description: "Minimum required success rate (0-1)"
        value: "0.99"
      - name: github-owner
        description: "GitHub repository owner"
      - name: github-repo
        description: "GitHub repository name"
      - name: github-pr-number
        description: "GitHub PR number for commenting"
      - name: github-app-id
        description: "GitHub App ID"
      - name: github-installation-id
        description: "GitHub App Installation ID"
      - name: github-private-key
        description: "GitHub App private key (base64 encoded)"
      - name: auth-token
        description: "Authentication token (optional)"
        value: ""
      - name: auth-api-key
        description: "API key for authentication (optional)"
        value: ""

  templates:
    - name: performance-testing
      container:
        image: driveby:latest
        command: ["./driveby"]
        args:
          - "load-only"
          - "--openapi"
          - "{{workflow.parameters.openapi-spec-url}}"
          - "--host"
          - "{{workflow.parameters.api-host}}"
          - "--port"
          - "{{workflow.parameters.api-port}}"
          - "--protocol"
          - "{{workflow.parameters.api-protocol}}"
          - "--environment"
          - "{{workflow.parameters.environment}}"
          - "--timeout"
          - "{{workflow.parameters.timeout}}"
          - "--concurrent-users"
          - "{{workflow.parameters.concurrent-users}}"
          - "--test-duration"
          - "{{workflow.parameters.test-duration}}"
          - "--max-latency-p95"
          - "{{workflow.parameters.max-latency-p95}}"
          - "--min-success-rate"
          - "{{workflow.parameters.min-success-rate}}"
          - "--report-dir"
          - "/tmp/reports"
          - "--log-level"
          - "info"
          - "--github-comment"
          - "--github-app-id"
          - "{{workflow.parameters.github-app-id}}"
          - "--github-installation-id"
          - "{{workflow.parameters.github-installation-id}}"
          - "--github-private-key"
          - "{{workflow.parameters.github-private-key}}"
          - "--github-owner"
          - "{{workflow.parameters.github-owner}}"
          - "--github-repo"
          - "{{workflow.parameters.github-repo}}"
          - "--github-pr-number"
          - "{{workflow.parameters.github-pr-number}}"
        env:
          - name: GITHUB_PRIVATE_KEY
            value: "{{workflow.parameters.github-private-key}}"
        volumeMounts:
          - name: reports-volume
            mountPath: /tmp/reports
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

    - name: save-performance-report
      container:
        image: alpine:latest
        command: ["sh", "-c"]
        args:
          - |
            echo "Saving performance test report..."
            cp /tmp/reports/* /shared/reports/ || true
            echo "Performance test report saved"
        volumeMounts:
          - name: reports-volume
            mountPath: /tmp/reports
          - name: shared-reports
            mountPath: /shared/reports

  volumes:
    - name: reports-volume
      emptyDir: {}
    - name: shared-reports
      persistentVolumeClaim:
        claimName: driveby-reports-pvc

  steps:
    - - name: run-performance-tests
        template: performance-testing
    - - name: save-report
        template: save-performance-report
        when: "{{steps.run-performance-tests.outputs.result}} == 'success'"

  outputs:
    parameters:
      - name: performance-test-status
        value: "{{steps.run-performance-tests.outputs.result}}"
      - name: performance-report-path
        value: "/shared/reports/performance-test-report-{{workflow.creationTimestamp}}.json"
        when: "{{steps.run-performance-tests.outputs.result}} == 'success'"
      - name: latency-p95
        value: "{{steps.run-performance-tests.outputs.parameters.latency-p95}}"
      - name: success-rate
        value: "{{steps.run-performance-tests.outputs.parameters.success-rate}}"
      - name: requests-per-second
        value: "{{steps.run-performance-tests.outputs.parameters.requests-per-second}}"
