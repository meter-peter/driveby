apiVersion: driveby.io/v1alpha1
kind: XSDLC
metadata:
  name: broken-api
  namespace: driveby
spec:
  gitopsRepository:
    owner: novelcore
    name: broken-api-gitops

  apiConfig:
    port: 8000
    openapiEndpoint: /openapi.json

  validationDefaults:
    validationMode: strict

  environments:
    - name: dev

    - name: staging
      gate:
        checks:
          - type: validate-only
            validationConfig:
              validationMode: strict
          - type: functional-test

    - name: prod
      autoMerge: false
      gate:
        checks:
          - type: validate-only
          - type: load-test
