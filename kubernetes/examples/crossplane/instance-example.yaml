apiVersion: driveby.io/v1alpha1
kind: XQualityGate
metadata:
  name: perfect-api-staging-gate
  namespace: driveby
spec:
  appName: perfect-api
  projectName: driveby
  gateName: staging-promotion
  templateRef:
    name: driveby-staging-promotion
  targetCluster:
    name: private-novelcore
    providerConfigName: kubernetes-provider
    baseDomain: private.novelcore.org
    namespace: driveby
  repositoryConfig:
    owner: novelcore
    name: perfect-api-gitops
    fullName: novelcore/perfect-api-gitops
  apiConfig:
    openapiEndpoint: /openapi.json
    port: 8000
    serviceName: perfect-api
    sourceEnvironment:
      namespace: perfect-api-dev
    targetEnvironment:
      namespace: perfect-api-staging
    authSecretName: driveby-api-auth
    authKeyHeader: X-API-Key
  # GitOps Promoter — automated environment promotion
  promoterConfig:
    githubApp:
      secretName: github-app-credentials
      appID: 3133001
      installationID: 117564832
    environments:
      - name: dev
        branch: environment/dev
        autoMerge: true
      - name: staging
        branch: environment/staging
        autoMerge: true
        gated: true        # DriveBy validates dev before staging promotes
      - name: prod
        branch: environment/prod
        autoMerge: false   # Manual approval for production
    commitStatusKey: driveby-staging-promotion
  # Optional: override cluster defaults
  # ingressConfig:
  #   className: traefik-system
  #   clusterIssuer: sys-prod-issuer-dns
  #   annotations:
  #     traefik.ingress.kubernetes.io/router.entrypoints: websecure
  # eventBusConfig:
  #   jetstreamVersion: "2.10.14"
  #   replicas: 3
  # webhookPort: 12000
  # GitHub webhook is auto-created by Argo Events using the configured GitHub App.
  # This XQualityGate config only defines which events trigger which workflow.
  eventTriggers:
    - name: pr-validation
      targetTemplate: promotion-pipeline
      events: [pull_request]
      filters:
        - path: body.action
          type: string
          value: [opened, reopened, synchronize]
      parameterMapping:
        - from: body.number
          to: pr-number
        - from: body.pull_request.head.sha
          to: head-sha
        - from: body.repository.owner.login
          to: github-owner
        - from: body.repository.name
          to: github-repo
