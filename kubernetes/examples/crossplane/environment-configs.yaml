# Template EnvironmentConfig — shared config for quality gate templates
# These values override Helm-baked defaults and can be further overridden per-CR via XRD spec fields.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: driveby-template-config
  labels:
    driveby.io/type: qualitygate-template-config
    driveby.io/project: driveby
    driveby.io/gate: staging-promotion
data:
  namespace: driveby
  domain: private.novelcore.org
  # Secret names
  imagePullSecret: ghcr-creds
  githubPatSecretName: github-pat
  githubPatSecretKey: token
  apiAuthSecretName: driveby-api-auth
  apiKeyHeader: X-API-Key
  # GitHub API
  githubApiUrl: https://api.github.com
  # Argo Workflows UI URL for commit status links
  workflowsUrl: https://argo.private.novelcore.org/workflows
  # Utility container images
  curlImage: curlimages/curl:8.7.1
  postgresImage: postgres:16-alpine
---
# Instance EnvironmentConfig — per-app config for quality gate instances
# These values override Helm-baked defaults and can be further overridden per-CR via XRD spec fields.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: driveby-instance-config
  labels:
    driveby.io/type: qualitygate-instance-config
    driveby.io/app: perfect-api
    driveby.io/gate: staging-promotion
data:
  webhookBaseDomain: private.novelcore.org
  # Ingress
  ingressClassName: traefik-system
  clusterIssuer: sys-prod-issuer-dns
  # Webhook port
  webhookPort: "12000"
  # JetStream EventBus
  jetstreamVersion: "2.10.10"
  eventBusReplicas: "1"
