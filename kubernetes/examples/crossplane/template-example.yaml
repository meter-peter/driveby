apiVersion: driveby.io/v1alpha1
kind: XQualityGateTemplate
metadata:
  name: driveby-staging-promotion
  namespace: driveby
spec:
  projectName: driveby
  gateName: staging-promotion
  gateKey: driveby/staging-promotion
  targetCluster:
    name: private-novelcore
    providerConfigName: kubernetes-provider
    namespace: driveby
  validationConfig:
    drivebyImage: ghcr.io/meter-peter/driveby:latest
    validationMode: strict
    serviceAccountName: driveby
  # Optional: override GitHub App secret name (default: github-app-credentials)
  # githubAppConfig:
  #   secretName: my-github-app-secret
  # Optional: override cluster defaults
  # secretsConfig:
  #   imagePullSecret: my-registry-creds
  #   apiAuthSecretName: my-api-auth
  #   apiKeyHeader: X-API-Key
  # workflowsUrl: https://argo.example.com/workflows
  # images:
  #   curl: curlimages/curl:8.7.1
  #   postgres: postgres:16-alpine
