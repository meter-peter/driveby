apiVersion: driveby.io/v1alpha1
kind: XSDLC
metadata:
  name: no-auth-api
  namespace: driveby
spec:
  gitopsRepository:
    owner: novelcore
    name: no-auth-api-gitops

  apiConfig:
    port: 8000
    openapiEndpoint: /openapi.json

  validationDefaults:
    validationMode: strict

  environments:
    - name: dev

    - name: staging
      gate:
        checks:
          - type: validate-only
            validationConfig:
              validationMode: strict

    - name: prod
      autoMerge: false
      gate:
        checks:
          - type: validate-only
          - type: functional-test
