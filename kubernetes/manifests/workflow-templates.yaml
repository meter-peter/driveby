apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: driveby-validate
  namespace: driveby
spec:
  entrypoint: validate
  serviceAccountName: driveby
  arguments:
    parameters:
      - name: openapi-url
      - name: api-host
      - name: api-port
        value: "8000"
      - name: validation-mode
        value: "minimal"
      - name: report-dir
        value: "/tmp/reports"
  templates:
    - name: validate
      container:
        image: ghcr.io/meter-peter/driveby:latest
        imagePullPolicy: Always
        command: ["/driveby"]
        args:
          - "validate-only"
          - "--openapi"
          - "{{workflow.parameters.openapi-url}}"
          - "--host"
          - "{{workflow.parameters.api-host}}"
          - "--port"
          - "{{workflow.parameters.api-port}}"
          - "--validation-mode"
          - "{{workflow.parameters.validation-mode}}"
          - "--report-dir"
          - "{{workflow.parameters.report-dir}}"
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: driveby-full-pipeline
  namespace: driveby
spec:
  entrypoint: full-pipeline
  serviceAccountName: driveby
  arguments:
    parameters:
      - name: openapi-url
      - name: api-host
      - name: api-port
        value: "8000"
      - name: validation-mode
        value: "strict"
  templates:
    - name: full-pipeline
      dag:
        tasks:
          - name: validate
            template: driveby-step
            arguments:
              parameters:
                - name: command
                  value: "validate-only"
                - name: extra-args
                  value: "--validation-mode {{workflow.parameters.validation-mode}}"
          - name: functional-test
            template: driveby-step
            dependencies: [validate]
            arguments:
              parameters:
                - name: command
                  value: "function-only"
                - name: extra-args
                  value: ""
          - name: performance-test
            template: driveby-step
            dependencies: [validate]
            arguments:
              parameters:
                - name: command
                  value: "load-only"
                - name: extra-args
                  value: "--concurrent-users 10 --test-duration 60s"
    - name: driveby-step
      inputs:
        parameters:
          - name: command
          - name: extra-args
      container:
        image: ghcr.io/meter-peter/driveby:latest
        imagePullPolicy: Always
        command: ["/driveby"]
        args:
          - "{{inputs.parameters.command}}"
          - "--openapi"
          - "{{workflow.parameters.openapi-url}}"
          - "--host"
          - "{{workflow.parameters.api-host}}"
          - "--port"
          - "{{workflow.parameters.api-port}}"
          - "--report-dir"
          - "/tmp/reports"
