apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: driveby-github
  namespace: driveby
spec:
  github:
    driveby-webhook:
      repositories:
        - owner: "meter-peter"
          names:
            - "perfect-api"
      webhook:
        endpoint: /github/driveby
        port: "12000"
        method: POST
      events:
        - pull_request
        - push
      apiToken:
        name: github-pat
        key: token
      insecure: false
      active: true
      contentType: json
