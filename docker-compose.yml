version: '3.8'

services:
  perfect-api:
    build:
      context: ./apis/perfect-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./apis/perfect-api/perfect-api.py:/app/perfect-api.py
      - ./apis/perfect-api/openapi.json:/app/openapi.json
    command: uvicorn perfect-api:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/test/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

