apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: driveby-functional-testing
  namespace: argo
spec:
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: openapi-spec-url
        description: "URL to OpenAPI specification"
      - name: api-host
        description: "API host to test"
      - name: api-port
        description: "API port (default: 8080)"
        value: "8080"
      - name: api-protocol
        description: "API protocol (http/https)"
        value: "http"
      - name: environment
        description: "Environment name"
        value: "production"
      - name: timeout
        description: "Request timeout in seconds"
        value: "30"
      - name: github-owner
        description: "GitHub repository owner"
      - name: github-repo
        description: "GitHub repository name"
      - name: github-pr-number
        description: "GitHub PR number for commenting"
      - name: github-app-id
        description: "GitHub App ID"
      - name: github-installation-id
        description: "GitHub App Installation ID"
      - name: github-private-key
        description: "GitHub App private key (base64 encoded)"
      - name: auth-token
        description: "Authentication token (optional)"
        value: ""
      - name: auth-api-key
        description: "API key for authentication (optional)"
        value: ""
  
  templates:
    - name: functional-testing
      container:
        image: driveby:latest
        command: ["./driveby"]
        args:
          - "function-only"
          - "--openapi"
          - "{{workflow.parameters.openapi-spec-url}}"
          - "--host"
          - "{{workflow.parameters.api-host}}"
          - "--port"
          - "{{workflow.parameters.api-port}}"
          - "--protocol"
          - "{{workflow.parameters.api-protocol}}"
          - "--environment"
          - "{{workflow.parameters.environment}}"
          - "--timeout"
          - "{{workflow.parameters.timeout}}"
          - "--report-dir"
          - "/tmp/reports"
          - "--log-level"
          - "info"
          - "--github-comment"
          - "--github-app-id"
          - "{{workflow.parameters.github-app-id}}"
          - "--github-installation-id"
          - "{{workflow.parameters.github-installation-id}}"
          - "--github-private-key"
          - "{{workflow.parameters.github-private-key}}"
          - "--github-owner"
          - "{{workflow.parameters.github-owner}}"
          - "--github-repo"
          - "{{workflow.parameters.github-repo}}"
          - "--github-pr-number"
          - "{{workflow.parameters.github-pr-number}}"
        env:
          - name: GITHUB_PRIVATE_KEY
            value: "{{workflow.parameters.github-private-key}}"
        volumeMounts:
          - name: reports-volume
            mountPath: /tmp/reports
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      
    - name: save-functional-report
      container:
        image: alpine:latest
        command: ["sh", "-c"]
        args:
          - |
            echo "Saving functional test report..."
            cp /tmp/reports/* /shared/reports/ || true
            echo "Functional test report saved"
        volumeMounts:
          - name: reports-volume
            mountPath: /tmp/reports
          - name: shared-reports
            mountPath: /shared/reports
  
  volumes:
    - name: reports-volume
      emptyDir: {}
    - name: shared-reports
      persistentVolumeClaim:
        claimName: driveby-reports-pvc
  
  steps:
    - - name: run-functional-tests
        template: functional-testing
    - - name: save-report
        template: save-functional-report
        when: "{{steps.run-functional-tests.outputs.result}} == 'success'"
  
  outputs:
    parameters:
      - name: functional-test-status
        value: "{{steps.run-functional-tests.outputs.result}}"
      - name: functional-report-path
        value: "/shared/reports/functional-test-report-{{workflow.creationTimestamp}}.json"
        when: "{{steps.run-functional-tests.outputs.result}} == 'success'"
