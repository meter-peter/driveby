name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        working-directory: driveby-cli
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -ldflags "-X github.com/meter-peter/driveby/driveby-cli/internal/cli.version=${VERSION} -X github.com/meter-peter/driveby/driveby-cli/internal/cli.commit=${{ github.sha }}" ./cmd/driveby

      - name: Vet
        working-directory: driveby-cli
        run: go vet ./...

      - name: Test
        working-directory: driveby-cli
        run: go test -count=1 -coverprofile=coverage.out ./test/...

      - name: Check documentation completeness
        run: bash tools/check-docs.sh

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: driveby-cli/coverage.out

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t driveby driveby-cli/
